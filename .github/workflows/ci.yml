name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx2

      - name: Run API tests
        run: |
          python -m pytest -q tests/test_api.py


  docker-build:

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t boston-house-price-api:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker images boston-house-price-api:${{ github.sha }}